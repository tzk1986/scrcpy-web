[project]
name = "openscrcpy"
version = "0.1.0"
description = "scrcpy Web-based remote control and debugging platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "aiosqlite>=0.20.0",
    "pywinpty>=2.0; sys_platform == 'win32'",
    "structlog>=24.1.0",
    "pyyaml>=6.0.1",
    "aiofiles>=23.2.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# 门禁工具锁定到本地实测版本，保证 CI == 本地、可复现；上游新版可能扩大规则集导致误红。
# 升级这些 pin 时需在本地重跑 ruff/mypy/pytest 三件套后再同步。
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "httpx>=0.27.0",
    "ruff==0.7.4",
    "mypy==1.20.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "backend"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["yaml", "winpty", "structlog.*", "aiosqlite", "aiofiles"]
ignore_missing_imports = true

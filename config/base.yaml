# Base Configuration (defaults)
app:
  name: OpenScrcpy
  version: 0.7.3
  debug: false
  log_level: INFO
  config_watch: true         # 配置文件（config/*.yaml）热重载监听
  config_watch_interval: 2.0 # 热重载 mtime 轮询间隔（秒）

server:
  host: 0.0.0.0
  port: 8765
  workers: 4

database:
  path: ./data/debug.sqlite
  echo: false

adb:
  path: adb
  timeout: 30
  probe_timeout: 1.5   # TCP 可达性预检超时（秒），仅用于 connect/disconnect 前置探测
  reconnect_interval: 5

stream:
  max_size: 1080
  bit_rate: 4M
  codec: h264
  fps: 30
  idle_reset_seconds: 5.0

debug:
  log_buffer_size: 50000
  session_ttl_days: 7
  shell_history_days: 30
  log_retention_days: 7
  max_db_size_mb: 2048  # 2GB
  cleanup_interval_hours: 1
  min_log_level: V  # Default: All logs (Verbose+) - 这是调试工具，应显示完整日志
  log_rate_limit: 500  # Max 500 logs per second

metrics:
  buffer_size: 3600           # Perf 内存暂存条数（@1s 采样约 1 小时/设备）
  network_buffer_size: 1800   # Network 内存暂存条数（@2s 采样约 1 小时/设备）
  network_interval: 2.0       # Network 采样间隔（秒）
  idle_ttl_seconds: 300       # 无订阅者/访问且未录制时的空闲停采宽限（秒）
  lost_failures: 3            # 连续采样失败阈值 → 判定设备失联
  recording: false            # 录制（落盘暂存）总开关，默认关闭
  retention_days: 3           # 缓存态保留期（天）
  max_rows_total: 500000      # 缓存态容量上限（Perf+Network 合计行数）
  # 阈值告警（方案 24）：连续 N 次越限触发；迟滞余量 + 连续 M 次安全解除；
  # 冷却期内重复触发仍进徽标但不弹 toast。consecutive 按「有效判定样本数」计
  # （fps 仅计实测 gfxinfo 窗口），各指标墙钟时限见 方案/24 §3.1 时限表
  thresholds:
    cpu_percent:    { above: 80.0, consecutive: 3, clear_margin: 5.0, clear_consecutive: 3, cooldown: 60 }
    memory_percent: { above: 90.0, consecutive: 3, clear_margin: 5.0, clear_consecutive: 3, cooldown: 60 }
    fps:            { below: 30.0, consecutive: 3, clear_margin: 5.0, clear_consecutive: 3, cooldown: 60 }
    rx_rate_kbps:   { enabled: false, above: 0.0, consecutive: 3, clear_margin: 0.0, clear_consecutive: 3, cooldown: 60 }
    tx_rate_kbps:   { enabled: false, above: 0.0, consecutive: 3, clear_margin: 0.0, clear_consecutive: 3, cooldown: 60 }

security:
  cors_origins:
    - http://localhost:8080

# CI 门禁：后端 ruff+mypy(strict)+pytest；前端 eslint+vitest+build。
# 注意：Playwright E2E 需物理 Android 设备，托管 runner 无设备，仅本地运行，
#       详见 docs/部署指南.md。

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.10 = 本地开发与 exe 打包环境口径（方案 15 §8.3）；3.11 = 上游声明版本
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check backend/app
      - name: Mypy (strict)
        run: python -m mypy backend/app
      - name: Pytest (含覆盖率门禁 80%)
        # timeout-minutes 兜底 flaky hang（2026-10-09 3.10 偶发静默挂起 80 分钟，重跑即绿）：
        # 正常耗时 <2 分钟；超时即中止，防止挂起烧满 6 小时 job 上限
        timeout-minutes: 10
        run: PYTHONPATH=backend:. python -m pytest tests/ --ignore=tests/e2e -q --cov=app --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test (含分层覆盖率门禁)
        run: npx vitest run --coverage
      - name: Build
        run: npm run build

# CI 门禁：后端 ruff+mypy(strict)+pytest；前端 eslint+vitest+build。
# 注意：Playwright E2E 需物理 Android 设备，托管 runner 无设备，仅本地运行，
#       详见 docs/部署指南.md。

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check backend/app
      - name: Mypy (strict)
        run: python -m mypy backend/app
      - name: Pytest (含覆盖率门禁 80%)
        run: PYTHONPATH=backend:. python -m pytest tests/ --ignore=tests/integration --ignore=tests/e2e -q --cov=app --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test (含分层覆盖率门禁)
        run: npx vitest run --coverage
      - name: Build
        run: npm run build

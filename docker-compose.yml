# [注意] 开发参考：本项目依赖 Windows 专属组件(ConPTY/pywinpty、scrcpy.exe、ProactorEventLoop)，
# 此 Docker 编排未在 Linux 容器实测，仅作服务器化方向的骨架。当前受支持运行方式见 docs/部署指南.md。

version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=prod
      - DB_PATH=/data/debug.sqlite
    volumes:
      - ./data:/data
      - ./config:/app/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  data:
